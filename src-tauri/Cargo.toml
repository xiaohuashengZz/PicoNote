[package]
name = "piconote"
version = "1.0.1"
description = "A lightweight local note-taking application"
authors = ["sPeanut"]
edition = "2021"

[lib]
name = "piconote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2.0", features = [] }


[dependencies]
# Tauri framework
tauri = { version = "2.0", features = ["devtools"] }
tauri-plugin-shell = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database - SQLite via rusqlite (simpler than sea-orm for now)
rusqlite = { version = "0.31", features = ["bundled"] }


# Async runtime
tokio = { version = "1.0", features = ["full"] }


# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


# Thread-safe primitives
parking_lot = "0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true